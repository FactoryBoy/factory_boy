[tox]
minversion = 1.9
envlist =
    lint
    docs
    examples
    linkcheck
    typecheck
    py{310,311,312,313,314,py310,py311}
    py{310,311,312,py310,py311}-django42-mongo-alchemy
    py{310,311,312,313,314,py310,py311}-django52-mongo-alchemy
    py{312,313,314}-django60-mongo-alchemy
    py{312,313,314}-djangomain-mongo-alchemy

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    pypy-3.10: pypy310
    pypy-3.11: pypy311

[testenv]
deps =
    alchemy: SQLAlchemy
    mongo: mongoengine
    mongo: mongomock
    # mongomock imports pkg_resources, provided by setuptools.
    mongo: setuptools>=66.1.1
    py{310,311,312,313,314}: Pillow
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6
    django60: Django>=6.0,<6.1
    # This deliberately includes pre-releases, see `pip_pre` section below.
    djangomain: Django>6.0,<7.0

setenv =
    py: DJANGO_SETTINGS_MODULE=tests.djapp.settings

pip_pre =
    djangomain: true

allowlist_externals = make
commands = make test

[testenv:docs]
extras = doc

whitelist_externals = make
commands = make doc spelling

[testenv:examples]
deps =
    -rexamples/requirements.txt

whitelist_externals = make
commands = make example-test

[testenv:linkcheck]
extras = doc

whitelist_externals = make
commands = make linkcheck

[testenv:lint]
deps =
    -rexamples/requirements.txt
    check_manifest
extras = dev

whitelist_externals = make
commands = make lint

[testenv:typecheck]
deps =
    mypy

whitelist_externals = make
commands = make typecheck
